# TR-IQL v3 preset for the shared Predator-Prey benchmark.
extends: tr_iql_v3

block_len: 20  # episodes per block (200 steps each)
block_var_floor: 1.0
explore_policy: "noisy_greedy"
explore_noise: 3.0

epsilon_start: 1.0
epsilon_finish: 0.3
epsilon_anneal_time: 50000

calib_bonus: 10.0  # discounted-return units; lets optimism lead before coordination is achieved
calib_bonus_anneal: 500000

wandb_group: "pred-prey-main"
wandb_tags: ["predator-prey", "tr_iql_v3"]
