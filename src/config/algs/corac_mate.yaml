# HC-RAC preset for MATE (obstacle-free 4v8-0, 500-step episodes).
#
# Use it together with the MATE camera-entity env preset, which supplies the
# agent/twin_agent pair, the replay cadence and kl_weight:
#
#   python src/main.py \
#     --env-config mate_belief_entity_gru_4v8_0 --config corac_mate \
#     --max-steps 500000 with seed=0 use_cuda=True device=0 \
#     buffer_cpu_only=True use_wandb=True wandb_project=rac-mate
#
# See paper_revision/hc_rac_audit.md for the diagnostics that matter on MATE.
extends: corac

# 500-step episodes: single-step TCL windows are degenerate (u_e stops
# separating episodes, so 32 of the 48 context dims only feed noise into the
# teacher's max over the bank). 16 steps matches the Predator-Prey preset.
corac_segment_len: 16

# MATE's return level moves from ~0 to ~500 during training, so the EMA
# standardisation of phi(R) kept remapping the same return to a different
# context (and needed corac_min_std_frac to avoid saturation). A fixed range,
# the same one RAC's slots use (mate_return_min/max), keeps phi stationary.
corac_return_range: [0.0, 1000.0]

# The twin and the teacher read u from an EMA copy of the TCL encoder, so the
# context distribution drifts like a target network instead of every update.
corac_target_tau: 0.005

# batch_size 32 replaced the whole 64-context bank every two updates, so the
# teacher's max ran over a new support each time. Two pushes per update turn
# the bank over in ~32 updates.
corac_bank_push: 2

name: "corac_mate"
wandb_tags: ["mate", "hcrac", "corac"]
