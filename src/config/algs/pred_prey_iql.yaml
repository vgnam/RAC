# IQL preset for the shared Predator-Prey benchmark.
extends: iql

# Keep the value-based baselines on the same optimization/data schedule.
lr: 0.0005
batch_size: 32
buffer_size: 5000
training_iters: 1
target_update_interval: 200
gamma: 0.99
n_step: 1

epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000

wandb_group: "pred-prey-main"
wandb_tags: ["predator-prey", "iql"]
