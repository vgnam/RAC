# IPPO preset for the shared Predator-Prey benchmark.
extends: ippo

# The actor and critic remain decentralized and recurrent. IPPO deliberately
# keeps its on-policy rollout/PPO settings inherited from ippo.yaml instead of
# sharing RAC/IQL's replay-buffer schedule.
agent: rnn
rnn_hidden_dim: 64
agent_recurrent: true
agent_orthogonal_init: true
obs_agent_id: true
obs_last_action: true

critic_hidden_dim: 64
critic_recurrent: true
critic_orthogonal_init: true

gamma: 0.99
gae_lambda: 1.0
lr: 0.0005
critic_lr: 0.0005

wandb_group: "pred-prey-main"
wandb_tags: ["predator-prey", "ippo"]
