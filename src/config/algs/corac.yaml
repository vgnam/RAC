# CoRAC (HC-RAC): RAC whose twin Q reads a continuous context
# c = [phi(R) ; trajectory-contrastive embedding] through a hypernetwork, with the
# optimistic teacher a max over a bank of recent contexts (no slots, no thresholds).
# Value learning and execution are otherwise identical to dual_iql_ree (RAC).
# See paper_revision/hc_rac_method.md.
extends: dual_iql_ree

context_labeler: "corac"
corac_n_freq: 16          # cosine features of the return
corac_embed_dim: 32       # trajectory embedding (TCL)
context_dim: 48           # = corac_n_freq + corac_embed_dim
twin_hyper_hidden: 64     # hypernetwork hidden width (zero-delta init)
corac_bank_size: 64       # contexts per agent the teacher maximises over
corac_segment_len: 1      # steps per window (view)
corac_hidden_dim: 64
corac_proj_dim: 32
corac_temperature: 0.1
corac_n_hard: 4           # outcome-swapped negatives per anchor
corac_pool_size: 4096     # random candidate steps for the neighbour search
corac_stat_momentum: 0.01
corac_lr: 0.0005

# The twin bootstraps with max_a' Q, which ratchets without bound on contexts
# that carry little reward signal (long horizons, many actions). The shared
# hypernetwork then spreads that inflation over the whole bank and the teacher's
# max selects exactly those contexts. Bound the twin target and the teacher to
# the realisable episode-return range, which is what hc_rac_method.md 4.3 claims
# already holds but nothing enforced. Measured on a 500-step 25-action harness
# (paper_revision/hc_rac_audit.md 3.2): twin target mean 388 -> 50, KL inf ->
# 1.0, behaviour Q 15.0 -> 18.4 (RAC 17.4), across 3 seeds.
twin_target_clamp: true

name: "corac"
