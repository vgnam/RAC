# CoRAC (HC-RAC) preset for the shared Predator-Prey benchmark: pred_prey_rac with
# continuous contexts read through a hypernetwork (see corac.yaml). Replay,
# epsilon schedule and execution are identical to pred_prey_rac.
extends: pred_prey_rac

context_labeler: "corac"
corac_use_return: true
corac_use_trajectory: true
corac_n_freq: 16
corac_embed_dim: 32
# context_dim is derived from the two flags above (see corac.yaml).
twin_hyper_hidden: 64
corac_bank_size: 64
corac_segment_len: 8      # steps per window; episodes are 200 steps
corac_hidden_dim: 64
corac_proj_dim: 32
corac_temperature: 0.1
corac_n_hard: 4
corac_pool_size: 4096
corac_stat_momentum: 0.01
corac_lr: 0.0005

# See corac.yaml: bound the twin bootstrap and the teacher to the realisable
# episode-return range (hc_rac_method.md 4.3, hc_rac_audit.md 3.2).
twin_target_clamp: true

name: "corac"
wandb_tags: ["predator-prey", "corac"]
