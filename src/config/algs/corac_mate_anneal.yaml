# HC-RAC on MATE — step B of the stability ladder (see run_mate_stability.py).
#
# The optimistic teacher only carries information while the teammates are still
# exploring; afterwards it keeps the behaviour policy chasing values that no
# episode reaches any more (hc_rac_audit.md 6). With a constant kl_weight that
# pressure grows exactly when the Q margins get tight, which is where the
# collapse in the LBF runs starts. Anneal it to zero over the middle of
# training instead.
#
#   A  corac_mate          fixed kl_weight, action_max teacher
#   B  corac_mate_anneal   + kl_weight 1 -> 0 over [50k, 250k]
#   C  corac_mate_argmax   + teacher_context_select: context_argmax
#   D  corac_mate_stable   + top-k teacher + scale-free KL temperature
extends: corac_mate

# Pinned so the ladder does not depend on the env preset's value (the env
# config wins over the alg config in src/main.py; the MATE preset sets 1.0).
kl_weight: 1.0
kl_weight_final: 0.0
kl_anneal_start: 50000
kl_anneal_end: 250000

name: "corac_mate_anneal"
wandb_tags: ["mate", "hcrac", "corac", "stability-B"]
